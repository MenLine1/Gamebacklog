apiVersion: v1
kind: ResourceQuota
metadata:
  name: gamebacklog-quota
  namespace: gamebacklog
spec:
  hard:
    requests.cpu: "2"
    requests.memory: 3Gi
    limits.cpu: "4"
    limits.memory: 4Gi
    requests.storage: 4Gi
    persistentvolumeclaims: "2"
    count/pods: "4"
    count/deployments.apps: "2"
    count/statefulsets.apps: "2"
    count/services: "6"
    count/secrets: "10"
    count/configmaps: "10"
