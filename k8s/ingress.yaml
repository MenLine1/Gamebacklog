apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gamebacklog
  namespace: gamebacklog
spec:
  ingressClassName: nginx
  rules:
    - host: gamebacklog.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gamebacklog
                port:
                  number: 80
