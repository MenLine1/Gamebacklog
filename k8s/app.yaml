apiVersion: apps/v1
kind: Deployment
metadata:
  name: gamebacklog
  namespace: gamebacklog
  labels:
    app.kubernetes.io/name: gamebacklog
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: gamebacklog
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gamebacklog
    spec:
      containers:
        - name: gamebacklog
          image: gamebacklog:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: NODE_ENV
              value: production
            - name: HOSTNAME
              value: 0.0.0.0
            - name: PORT
              value: "3000"
            - name: MONGODB_DB
              valueFrom:
                configMapKeyRef:
                  name: gamebacklog-config
                  key: MONGODB_DB
            - name: MONGODB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: gamebacklog-mongodb
                  key: MONGO_ROOT_USERNAME
            - name: MONGODB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: gamebacklog-mongodb
                  key: MONGO_ROOT_PASSWORD
            - name: MONGODB_URI
              value: "mongodb://$(MONGODB_USERNAME):$(MONGODB_PASSWORD)@mongodb:27017/$(MONGODB_DB)?authSource=admin"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet:
              path: /api/games
              port: http
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: gamebacklog
  namespace: gamebacklog
  labels:
    app.kubernetes.io/name: gamebacklog
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: gamebacklog
  ports:
    - name: http
      port: 80
      targetPort: http
