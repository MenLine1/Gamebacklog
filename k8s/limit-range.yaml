apiVersion: v1
kind: LimitRange
metadata:
  name: gamebacklog-limits
  namespace: gamebacklog
spec:
  limits:
    - type: Container
      min:
        cpu: 50m
        memory: 64Mi
      max:
        cpu: "2"
        memory: 2Gi
      defaultRequest:
        cpu: 100m
        memory: 128Mi
      default:
        cpu: 500m
        memory: 512Mi
    - type: PersistentVolumeClaim
      min:
        storage: 1Gi
      max:
        storage: 8Gi
